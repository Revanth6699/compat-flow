name: Connector simulator integration (paused)

# Temporarily paused by request. Keep the workflow and simulator assets so
# protocol integration testing can be resumed deliberately later.
# The manual trigger is retained for discoverability, but the job-level guard
# prevents accidental execution until this workflow is explicitly re-enabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-integration:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    steps:
      - name: Simulator integration is paused
        run: |
          echo "Connector simulator integration is intentionally paused."
          echo "Remove the job-level if guard and restore the original triggers to resume."
