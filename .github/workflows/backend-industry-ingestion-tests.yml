name: Backend industry ingestion tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-industry-ingestion-tests.yml"
  push:
    branches:
      - feature/organization-first-onboarding
    paths:
      - "backend/**"
      - ".github/workflows/backend-industry-ingestion-tests.yml"

permissions:
  contents: read

jobs:
  industry-ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the PostgreSQL major version used by the Supabase production target.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compatflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compatflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/compatflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations to the CI PostgreSQL service
        env:
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Run the complete backend regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
