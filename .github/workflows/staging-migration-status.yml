name: Staging database migration status

on:
  workflow_dispatch:
  push:
    branches:
      - feature/backend-auth-authorization
    paths:
      - .github/workflows/staging-migration-status.yml
      - backend/migrations/**
      - backend/alembic.ini
      - backend/migrations/env.py

permissions:
  contents: read

jobs:
  migration-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read staging database migration revision
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret STAGING_DATABASE_URL is not configured."
            exit 1
          fi
          # Render's external URL may omit the SQLAlchemy driver. Force Psycopg 3,
          # which is the PostgreSQL driver installed by backend/requirements.txt.
          export DATABASE_URL="$(python -c 'import os; from sqlalchemy.engine import make_url; url = make_url(os.environ["DATABASE_URL"]); print(url.set(drivername="postgresql+psycopg").render_as_string(hide_password=False))')"
          echo "Configured Alembic heads:"
          python -m alembic heads
          echo "Current staging database revision:"
          python -m alembic current -v
