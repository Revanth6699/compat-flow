name: Staging database migration status

on:
  workflow_dispatch:
  push:
    branches:
      - feature/backend-auth-authorization
    paths:
      - .github/workflows/staging-migration-status.yml
      - backend/migrations/**
      - backend/alembic.ini
      - backend/migrations/env.py

permissions:
  contents: read

jobs:
  migration-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert staging database is at the configured Alembic head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret STAGING_DATABASE_URL is not configured."
            exit 1
          fi
          # Render's external URL may omit the SQLAlchemy driver. Force Psycopg 3.
          export DATABASE_URL="$(python -c 'import os; from sqlalchemy.engine import make_url; url = make_url(os.environ["DATABASE_URL"]); print(url.set(drivername="postgresql+psycopg").render_as_string(hide_password=False))')"

          python - <<'PY'
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          expected_heads = set(ScriptDirectory.from_config(config).get_heads())
          engine = create_engine(__import__("app.core.config", fromlist=["settings"]).settings.database_url)
          try:
              with engine.connect() as connection:
                  current_heads = set(MigrationContext.configure(connection).get_current_heads())
          finally:
              engine.dispose()

          print(f"Expected Alembic head(s): {sorted(expected_heads)}")
          print(f"Current staging revision(s): {sorted(current_heads)}")
          if current_heads != expected_heads:
              raise SystemExit(
                  "Staging database is not at Alembic head. Apply the reviewed staging migration before rollout."
              )
          print("Staging database schema is at Alembic head.")
          PY
