services:
  rest-supplier:
    image: python:3.12-slim
    working_dir: /simulator
    command: >
      sh -c "openssl req -x509 -newkey rsa:2048 -nodes
      -keyout /run/tls/server.key -out /run/tls/server.crt
      -days 2 -subj /CN=localhost
      -addext subjectAltName=DNS:localhost,IP:127.0.0.1
      -addext basicConstraints=critical,CA:TRUE
      && python server.py"
    environment:
      SIMULATOR_API_KEY: local-test-key
    volumes:
      - ./rest:/simulator:ro
      - rest-tls:/run/tls
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8443),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  sftp-supplier:
    image: atmoz/sftp:alpine
    command: supplier:Supplier-ReadOnly-2026!:1001:1001:upload
    volumes:
      - ./sftp/upload:/home/supplier/upload:ro
    ports:
      - "2222:22"

  sql-cert-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/generate-certs.sh"]
    volumes:
      - sql-tls:/tls
      - ./sql/generate-certs.sh:/generate-certs.sh:ro

  sql-supplier:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: "0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        chown mssql:mssql /tls/sql-server.crt /tls/sql-server.key
        chmod 440 /tls/sql-server.crt /tls/sql-server.key
        /opt/mssql/bin/mssql-conf set network.tlscert /tls/sql-server.crt
        /opt/mssql/bin/mssql-conf set network.tlskey /tls/sql-server.key
        /opt/mssql/bin/mssql-conf set network.tlsprotocols 1.2
        /opt/mssql/bin/mssql-conf set network.forceencryption 1
        export HOME=/var/opt/mssql
        export USER=mssql
        export LOGNAME=mssql
        cd /var/opt/mssql
        exec su -p -s /bin/bash -c 'exec /opt/mssql/bin/sqlservr' mssql
    depends_on:
      sql-cert-init:
        condition: service_completed_successfully
    volumes:
      - sql-tls:/tls
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SIMULATOR_SA_PASSWORD:?Generate a disposable SIMULATOR_SA_PASSWORD before starting the simulator}
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"</dev/tcp/127.0.0.1/1433\""]
      interval: 10s
      timeout: 5s
      retries: 30

  sql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sql-supplier:
        condition: service_healthy
    volumes:
      - ./sql/init.sql:/seed/init.sql:ro
      - ./sql/seed.sh:/seed/seed.sh:ro
    environment:
      SIMULATOR_READER_PASSWORD: ${SIMULATOR_READER_PASSWORD:?Generate a disposable SIMULATOR_READER_PASSWORD before starting the simulator}
      SIMULATOR_SA_PASSWORD: ${SIMULATOR_SA_PASSWORD:?Generate a disposable SIMULATOR_SA_PASSWORD before starting the simulator}
    entrypoint: ["/bin/bash", "/seed/seed.sh"]

volumes:
  rest-tls:
  sql-tls:
