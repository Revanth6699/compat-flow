services:
  rest-supplier:
    image: python:3.12-slim
    working_dir: /simulator
    command: >
      sh -c "openssl req -x509 -newkey rsa:2048 -nodes
      -keyout /run/tls/server.key -out /run/tls/server.crt
      -days 2 -subj /CN=localhost
      -addext subjectAltName=DNS:localhost,IP:127.0.0.1
      -addext basicConstraints=critical,CA:TRUE
      && python server.py"
    environment:
      SIMULATOR_API_KEY: local-test-key
    volumes:
      - ./rest:/simulator:ro
      - rest-tls:/run/tls
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8443),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  sftp-supplier:
    image: atmoz/sftp:alpine
    command: supplier:Supplier-ReadOnly-2026!:1001:1001:upload
    volumes:
      - ./sftp/upload:/home/supplier/upload:ro
    ports:
      - "2222:22"

  sql-supplier:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Simulator-SA-Only-2026!"
    ports:
      - "14333:1433"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  rest-tls:
